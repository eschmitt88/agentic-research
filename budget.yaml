# Hard ceilings for autonomous runs. Chain halts when any is hit.
# Sized for a Max plan box running the latest Opus for both roles.
max_wall_hours: 24
max_tokens: 5000000
max_experiments: 20
max_consecutive_no_improvement: 3
max_disk_gb: 500

# Autonomy: this literature hub auto-fetches/ingests its digest backlog
# while the coordinator's agency verdict permits and the ceilings above
# hold. See ~/claude-system/claude/rules/agency.md.
agency: max

# Model roles. Skills read these as the defaults; CLI flags override per-call.
models:
  ideator: "opus"
  implementer: "opus"

# Hardware hints (read by /implement, surfaced to the subagent).
hardware:
  gpu_model: "NVIDIA RTX 5080"
  gpu_memory_gb: 16
  gpu_count: 1
  system_ram_gb: 64    # edit to match
  storage_path: "/mnt/projects"
  storage_free_gb: 3400

# Git behavior. Meta project auto-pushes so overnight curation lands
# on GitHub without manual intervention. No skill reads this yet —
# the flag is read by the SessionEnd hook (when installed) or by
# /wrap; until then it documents intent.
git:
  auto_push: true
